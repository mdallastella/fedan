name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          name="fedan_${VERSION#v}_linux_amd64"
          mkdir "$name"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION#v}" -o "$name/fedan" ./cmd/fedan
          cp LICENSE README.md compose.yaml "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes ./*.tar.gz checksums.txt
