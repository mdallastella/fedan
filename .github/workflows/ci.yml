name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: test -z "$(gofmt -l cmd internal web)"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
