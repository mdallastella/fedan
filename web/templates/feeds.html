{{define "content"}}
{{with .Data}}
<details {{if or (not .Feeds) $.Error}}open{{end}}>
  <summary role="button">Add a feed</summary>
  <form method="post" action="/feeds">
    <label>Feed or website URL
      <input type="url" name="url" value="{{.URL}}" placeholder="https://example.com/" required>
      <small>A web page works too: fēdan finds the feed it links to.</small>
    </label>
    <label>Tags
      <input name="tags" value="{{.TagInput}}">
      <small>Separated by spaces or commas. <code>main</code> routes to the default destination.
        {{with .AllTags}}Existing: {{join . ", "}}.{{end}}</small>
    </label>
    <button>Add feed</button>
  </form>
</details>

<h2>Feeds</h2>
{{if .Feeds}}
<table>
  <thead><tr><th>Feed</th><th>Tags</th><th>Status</th><th>Last fetch</th></tr></thead>
  <tbody>{{range .Feeds}}
    <tr>
      <td class="wrap"><a href="/feeds/{{.ID}}">{{.Name}}</a></td>
      <td>{{template "tags" .Tags}}{{if eq .Routes 0}}<br><small class="muted">⚠ routed nowhere</small>{{end}}</td>
      <td><span class="st {{status .Status}}" {{with .LastError}}title="{{.}}"{{end}}>{{.Status}}</span></td>
      <td>{{ago .LastFetchedAt}}</td>
    </tr>
  {{end}}</tbody>
</table>
{{else}}<p class="muted">No feeds yet.</p>{{end}}
{{end}}
{{end}}
