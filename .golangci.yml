version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        # Queries concatenate only constant clauses and "?" placeholders;
        # values are always bound parameters.
        - G202
    errcheck:
      # Closing read-only handles has no actionable error.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close

formatters:
  enable:
    - gofmt
